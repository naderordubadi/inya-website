<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - INYA New York</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .page-content { padding: 8rem 6% 4rem; max-width: 800px; margin: 0 auto; }
        .page-content h1 { font-family: var(--font-heading); margin-bottom: 2rem; font-weight: 400; font-size: 2.5rem; text-align: center; }
        .contact-form { display: flex; flex-direction: column; gap: 1.5rem; }
        .contact-form input, .contact-form textarea { width: 100%; padding: 1rem; border: 1px solid #ccc; font-family: var(--font-body); font-size: 1rem; }
        .contact-form textarea { min-height: 150px; resize: vertical; }
        .contact-form button { background: var(--primary-color); color: #fff; border: none; padding: 1rem 2rem; font-family: var(--font-heading); text-transform: uppercase; cursor: pointer; transition: background 0.3s; }
        .contact-form button:hover { background: var(--accent-color); }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">
            <img src="/images/beyaz_zemin.jpg" alt="INYA Logo">
        </a>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/collections/all.html">Collections</a></li>
                <li><a href="/pages/about.html">About Us</a></li>
                <li><a href="/pages/contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-content">
        <h1>Contact Us</h1>
        <form class="contact-form" action="#" method="POST">
            <input type="text" name="name" placeholder="Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="text" name="phone" placeholder="Phone Number">
            <textarea name="message" placeholder="Message" required></textarea>
            <button type="submit">Send</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 INYA New York. All rights reserved.</p>
    </footer>
</body>
</html>
