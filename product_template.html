<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - INYA New York</title>
    <meta name="description" content="Shop the {{title}} at INYA New York. Explore our luxury collection of sustainable shoulder bags and handbags.">
    <meta property="og:title" content="{{title}} - INYA New York" />
    <meta property="og:description" content="Shop the {{title}} at INYA New York. Explore our luxury collection of sustainable shoulder bags and handbags." />
    <meta property="og:image" content="https://www.inyanewyork.com/images/homepage_1000x2000_ec3da9d7-fdd0-4d6c-928e-2609e0e950c3.jpg" />
    <meta property="og:url" content="https://www.inyanewyork.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/images/beyaz_zemin.jpg">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/product.css">
</head>
<body>
    <header>
        <a href="/" class="logo">
            <img src="/images/beyaz_zemin.jpg" alt="INYA Logo">
        </a>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/collections/all.html">Collections</a></li>
                <li><a href="/pages/about.html">About Us</a></li>
                <li><a href="/pages/contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="product-page">
        <div class="product-container">
            <div class="product-gallery">
                {{images_html}}
            </div>
            
            <div class="product-details">
                <h1 class="product-title">{{title}}</h1>
                <p class="product-sku">SKU: {{sku}}</p>
                <p class="product-price">${{price}}</p>
                
                <div class="product-description">
                    {{body_html}}
                </div>
                
                <div class="checkout-actions">
                    <a href="https://www.tiktok.com/view/product/{{tiktok_id}}" target="_blank" rel="noopener noreferrer" class="buy-btn large-btn">
                        Buy on TikTok
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 INYA New York. All rights reserved.</p>
    </footer>

    <!-- Lightbox Modal -->
    <div id="image-modal" class="image-modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modal-img">
    </div>

    <script>
        const modal = document.getElementById("image-modal");
        const modalImg = document.getElementById("modal-img");
        const closeBtn = document.getElementsByClassName("close-modal")[0];
        
        document.querySelectorAll('.gallery-image').forEach(img => {
            img.onclick = function(){
                modal.style.display = "flex";
                modalImg.src = this.src;
            }
        });
        
        closeBtn.onclick = function() {
            modal.style.display = "none";
        }
        modal.onclick = function(e) {
            if (e.target !== modalImg) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
